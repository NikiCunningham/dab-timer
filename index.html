<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dab Timer</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #161618;
    --border: #2a2a30;
    --text: #e4e4e7;
    --muted: #6b6b76;
    --accent: #a78bfa;
    --heat: #f97316;
    --ready: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1rem;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 480px;
    transition: border-color 0.2s, opacity 0.2s;
  }

  .card.heat-active { border-color: var(--heat); }
  .card.cool-active { border-color: var(--ready); }
  .card.cool-waiting { opacity: 0.55; }

  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .timer-display {
    font-size: 3rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 0.75rem 0;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  .timer-display.ready { color: var(--ready); }
  .timer-display.heating { color: var(--heat); }

  .controls {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    margin-top: 1rem;
  }

  button {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.15s;
  }

  button:hover:not(:disabled) { background: #3a3a42; }
  button:active:not(:disabled) { transform: scale(0.97); }

  button.primary {
    background: var(--accent);
    color: #0d0d0f;
    font-weight: 600;
  }

  button.primary:hover:not(:disabled) { background: #c4b5fd; }

  button.danger {
    background: #dc2626;
    color: #fff;
  }

  button.danger:hover:not(:disabled) { background: #ef4444; }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .time-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin: 0.75rem 0;
    flex-wrap: wrap;
  }

  .input-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg);
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .input-group label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .time-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.5rem;
    font-family: 'SF Mono', 'Consolas', monospace;
    width: 72px;
    text-align: center;
    padding: 0.25rem;
    border-radius: 4px;
  }

  .time-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .step-btn {
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    background: var(--border);
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .step-btn:hover:not(:disabled) { background: #3a3a42; }
  .step-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .waiting-state {
    text-align: center;
    padding: 0.5rem 1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .waiting-state .waiting-icon {
    font-size: 1.75rem;
    margin-bottom: 0.25rem;
    opacity: 0.5;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0.75rem 0;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--heat), var(--ready));
    border-radius: 2px;
    transition: width 0.1s linear;
    width: 0%;
  }

  .alert-bar {
    text-align: center;
    padding: 0.6rem;
    border-radius: 8px;
    margin-top: 0.75rem;
    font-weight: 600;
    font-size: 0.85rem;
    display: none;
  }

  .alert-bar.show { display: block; }

  .alert-bar.heat-reached {
    background: rgba(249, 115, 22, 0.15);
    color: var(--heat);
    border: 1px solid var(--heat);
  }

  .alert-bar.ready {
    background: rgba(74, 222, 128, 0.15);
    color: var(--ready);
    border: 1px solid var(--ready);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .session-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    margin-top: 0.75rem;
    text-align: center;
  }

  .session-stat {
    background: var(--bg);
    padding: 0.5rem;
    border-radius: 6px;
  }

  .session-stat-label {
    font-size: 0.55rem;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .session-stat-value {
    font-size: 1rem;
    font-family: 'SF Mono', 'Consolas', monospace;
    margin-top: 0.15rem;
  }

  .countdown-mode {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin: 0.5rem 0;
  }

  .countdown-mode label {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .mode-btn {
    font-size: 0.75rem;
    padding: 0.35rem 0.6rem;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .mode-btn.active {
    background: var(--accent);
    color: #0d0d0f;
    border-color: var(--accent);
  }

  .divider {
    height: 1px;
    background: var(--border);
    width: 100%;
    max-width: 480px;
    margin: 0.25rem 0;
  }

  .log-section {
    max-width: 480px;
    width: 100%;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .log-clear {
    font-size: 0.7rem;
    color: var(--muted);
    background: none;
    padding: 0.2rem 0.4rem;
  }

  .log-clear:hover { color: var(--text); }

  .log-list {
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .log-entry {
    background: var(--bg);
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.75rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.3rem 0.75rem;
  }

  .log-time {
    color: var(--muted);
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 0.7rem;
  }

  .log-detail {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .log-tag { color: var(--muted); }

  .empty-log {
    color: var(--muted);
    text-align: center;
    padding: 1.5rem;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<h1>Dab Timer</h1>

<!-- HEAT TIMER CARD — always visible, top -->
<div class="card" id="heat-card">
  <div class="card-title">Heat Timer</div>
  <div class="timer-display heating" id="heat-timer">00:00</div>

  <div class="time-controls">
    <div class="input-group">
      <label>Heat for</label>
      <button class="step-btn" id="heat-target-down-5">−5</button>
      <input type="number" class="time-input" id="heat-target-input" value="45" min="1" max="999">
      <button class="step-btn" id="heat-target-up-5">+5</button>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="controls">
    <button class="primary" id="heat-start">Start Heating</button>
    <button id="heat-pause" disabled>Pause</button>
    <button class="danger" id="heat-reset">Reset</button>
  </div>

  <div class="alert-bar heat-reached" id="heat-alert">
    ⏱ Heat complete! Cooling now...
  </div>

  <div class="session-info">
    <div class="session-stat">
      <div class="session-stat-label">Elapsed</div>
      <div class="session-stat-value" id="heat-elapsed-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Target</div>
      <div class="session-stat-value" id="heat-target-stat">45s</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Progress</div>
      <div class="session-stat-value" id="heat-progress-pct">0%</div>
    </div>
  </div>
</div>

<!-- COOL TIMER CARD — always visible, below heat -->
<div class="card cool-waiting" id="cool-card">
  <div class="card-title" id="cool-title">Cool Down</div>

  <!-- Waiting state: setup panel shown until heat completes -->
  <div id="cool-waiting-state" class="waiting-state">
    <div class="waiting-icon">⏳</div>
    <div>Heat must complete first</div>

    <div class="time-controls">
      <div class="input-group">
        <label>Cool for</label>
        <button class="step-btn" id="cool-target-down-5">−5</button>
        <input type="number" class="time-input" id="cool-target-input" value="60" min="1" max="999">
        <button class="step-btn" id="cool-target-up-5">+5</button>
      </div>
    </div>

    <div class="countdown-mode">
      <label>Cool-down:</label>
      <button class="mode-btn active" data-mode="countdown" id="cool-mode-countdown">Timer</button>
      <button class="mode-btn" data-mode="manual" id="cool-mode-manual">Manual</button>
    </div>
  </div>

  <!-- Active cool timer: shown after heat completes -->
  <div class="timer-display ready" id="cool-timer" style="display:none;">00:00</div>

  <div class="controls">
    <button class="primary" id="cool-start" style="display:none;">Ready to Hit</button>
    <button id="cool-pause" disabled style="display:none;">Pause</button>
    <button class="danger" id="cool-reset" style="display:none;">Reset</button>
  </div>

  <div class="alert-bar ready" id="cool-alert">
    ✅ Ready to hit!
  </div>

  <div class="session-info">
    <div class="session-stat">
      <div class="session-stat-label">Cool Time</div>
      <div class="session-stat-value" id="cool-elapsed-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Total Session</div>
      <div class="session-stat-value" id="total-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Heat Time</div>
      <div class="session-stat-value" id="final-heat-display">00:00</div>
    </div>
  </div>
</div>

<div class="divider"></div>

<!-- SESSION LOG -->
<div class="card log-section">
  <div class="log-header">
    <div class="card-title" style="margin-bottom:0;">Session Log</div>
    <button class="log-clear" id="log-clear">Clear</button>
  </div>
  <div class="log-list" id="log-list">
    <div class="empty-log">No sessions yet. Start heating to begin.</div>
  </div>
</div>

<script>
  const state = {
    heatRunning: false,
    heatPaused: false,
    heatElapsed: 0,
    heatStartTimestamp: 0,
    heatTargetReached: false,

    coolRunning: false,
    coolPaused: false,
    coolElapsed: 0,
    coolStartTimestamp: 0,
    coolMode: 'countdown',
    coolCountdownSeconds: 60,

    heatTargetSeconds: 45,

    log: []
  };

  const $ = id => document.getElementById(id);

  // Heat card refs
  const heatCard = $('heat-card');
  const heatTimerEl = $('heat-timer');
  const heatTargetInput = $('heat-target-input');
  const heatElapsedDisplay = $('heat-elapsed-display');
  const heatTargetStat = $('heat-target-stat');
  const heatProgressPct = $('heat-progress-pct');
  const progressFill = $('progress-fill');
  const heatAlert = $('heat-alert');

  // Cool card refs
  const coolCard = $('cool-card');
  const coolTitle = $('cool-title');
  const coolWaitingState = $('cool-waiting-state');
  const coolTimerEl = $('cool-timer');
  const coolTargetInput = $('cool-target-input');
  const coolStartBtn = $('cool-start');
  const coolPauseBtn = $('cool-pause');
  const coolResetBtn = $('cool-reset');
  const coolElapsedDisplay = $('cool-elapsed-display');
  const totalDisplay = $('total-display');
  const finalHeatDisplay = $('final-heat-display');
  const coolAlert = $('cool-alert');

  let heatInterval = null;
  let coolInterval = null;

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function fmtMs(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function now() { return Date.now(); }

  // ---- Sound: heat target reached ----
  function playHeatSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';

      // Two-tone beep: 880Hz for 150ms, pause, 1100Hz for 200ms
      const t = ctx.currentTime;
      osc.frequency.setValueAtTime(880, t);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
      osc.start(t);
      osc.stop(t + 0.15);

      // Second tone
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1100, t + 0.2);
      gain2.gain.setValueAtTime(0.3, t + 0.2);
      gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
      osc2.start(t + 0.2);
      osc2.stop(t + 0.4);
    } catch (e) {
      // Audio not available — fail silently
    }
  }

  // ---- Heat timer ----
  function startHeat() {
    state.heatRunning = true;
    state.heatPaused = false;
    state.heatStartTimestamp = now() - state.heatElapsed;
    heatInterval = setInterval(tickHeat, 100);
    heatCard.classList.add('heat-active');
    updateHeatUI();
  }

  function tickHeat() {
    // Safety guard: if target already reached, stop ticking
    if (state.heatTargetReached) {
      if (heatInterval) { clearInterval(heatInterval); heatInterval = null; }
      state.heatRunning = false;
      return;
    }
    if (!state.heatPaused) {
      state.heatElapsed = now() - state.heatStartTimestamp;
      const elapsedSec = state.heatElapsed / 1000;
      heatTimerEl.textContent = fmt(elapsedSec);
      heatElapsedDisplay.textContent = fmt(elapsedSec);

      const pct = Math.min(100, (elapsedSec / state.heatTargetSeconds) * 100);
      progressFill.style.width = `${pct}%`;
      heatProgressPct.textContent = `${Math.floor(pct)}%`;

      if (elapsedSec >= state.heatTargetSeconds && !state.heatTargetReached) {
        state.heatTargetReached = true;
        // Stop heat counting — freeze timer at target time
        clearInterval(heatInterval);
        heatInterval = null;
        state.heatRunning = false;
        heatAlert.classList.add('show');
        playHeatSound();
        activateCoolPhase();
      }
    }
  }

  function pauseHeat() {
    state.heatPaused = !state.heatPaused;
    updateHeatUI();
  }

  function resetHeat() {
    state.heatRunning = false;
    state.heatPaused = false;
    state.heatElapsed = 0;
    state.heatTargetReached = false;
    if (heatInterval) clearInterval(heatInterval);
    heatInterval = null;
    heatTimerEl.textContent = '00:00';
    heatElapsedDisplay.textContent = '00:00';
    progressFill.style.width = '0%';
    heatProgressPct.textContent = '0%';
    heatAlert.classList.remove('show');
    heatCard.classList.remove('heat-active');
    resetCoolPhase();
    updateHeatUI();
  }

  function updateHeatUI() {
    $('heat-start').disabled = state.heatRunning || state.heatTargetReached;
    $('heat-pause').disabled = !state.heatRunning;
    $('heat-pause').textContent = state.heatPaused ? 'Resume' : 'Pause';
  }

  // ---- Heat target time controls ----
  function setHeatTarget(seconds) {
    seconds = Math.max(1, Math.min(999, seconds));
    state.heatTargetSeconds = seconds;
    heatTargetInput.value = seconds;
    heatTargetStat.textContent = `${seconds}s`;
  }

  heatTargetInput.addEventListener('change', () => {
    let val = parseInt(heatTargetInput.value);
    if (isNaN(val) || val < 1) val = 1;
    setHeatTarget(val);
  });

  heatTargetInput.addEventListener('input', () => {
    let val = parseInt(heatTargetInput.value);
    if (!isNaN(val) && val >= 1) setHeatTarget(val);
  });

  $('heat-target-up-5').addEventListener('click', () => setHeatTarget(state.heatTargetSeconds + 5));
  $('heat-target-down-5').addEventListener('click', () => setHeatTarget(state.heatTargetSeconds - 5));

  // ---- Cool phase: waiting → active ----
  function activateCoolPhase() {
    coolWaitingState.style.display = 'none';
    coolTimerEl.style.display = 'block';
    coolStartBtn.style.display = state.coolMode === 'countdown' ? 'none' : 'inline-block';
    coolPauseBtn.style.display = 'inline-block';
    coolResetBtn.style.display = 'inline-block';

    coolCard.classList.remove('cool-waiting');
    coolCard.classList.add('cool-active');

    if (state.coolMode === 'countdown') {
      coolTimerEl.textContent = fmt(state.coolCountdownSeconds);
      coolTimerEl.classList.add('ready');
      // Auto-start the cool countdown
      startCoolCountdown();
    } else {
      coolTimerEl.textContent = '00:00';
      coolStartBtn.disabled = false;
      coolStartBtn.textContent = '✅ Mark Ready';
      coolPauseBtn.disabled = true;
    }
  }

  // Starts the cool countdown without requiring a button press (auto-start after heat)
  function startCoolCountdown() {
    state.coolElapsed = 0;
    state.coolRunning = true;
    state.coolPaused = false;
    state.coolStartTimestamp = now();
    coolInterval = setInterval(tickCool, 100);
    updateCoolUI();
  }

  function resetCoolPhase() {
    state.coolRunning = false;
    state.coolPaused = false;
    state.coolElapsed = 0;
    if (coolInterval) clearInterval(coolInterval);
    coolInterval = null;

    coolWaitingState.style.display = 'block';
    coolTimerEl.style.display = 'none';
    coolStartBtn.style.display = 'none';
    coolPauseBtn.style.display = 'none';
    coolResetBtn.style.display = 'none';

    coolCard.classList.remove('cool-active');
    coolCard.classList.add('cool-waiting');

    coolElapsedDisplay.textContent = '00:00';
    totalDisplay.textContent = '00:00';
    finalHeatDisplay.textContent = '00:00';
    coolAlert.classList.remove('show');
  }

  // ---- Cool timer ----
  function startCool() {
    if (state.coolMode === 'countdown') {
      state.coolElapsed = 0;
      state.coolRunning = true;
      state.coolPaused = false;
      state.coolStartTimestamp = now();
      coolInterval = setInterval(tickCool, 100);
      coolPauseBtn.disabled = false;
      updateCoolUI();
    } else {
      logSession();
      resetAll();
    }
  }

  function tickCool() {
    if (!state.coolPaused) {
      state.coolElapsed = now() - state.coolStartTimestamp;
      const remaining = Math.max(0, state.coolCountdownSeconds - state.coolElapsed / 1000);
      coolTimerEl.textContent = fmt(remaining);
      coolElapsedDisplay.textContent = fmt(state.coolElapsed / 1000);

      const totalSec = state.heatElapsed / 1000 + state.coolElapsed / 1000;
      totalDisplay.textContent = fmt(totalSec);
      finalHeatDisplay.textContent = fmt(state.heatElapsed / 1000);

      if (remaining <= 0) {
        coolAlert.classList.add('show');
        state.coolRunning = false;
        clearInterval(coolInterval);
        coolInterval = null;
        logSession();
        resetAll();
      }
    }
  }

  function pauseCool() {
    state.coolPaused = !state.coolPaused;
    updateCoolUI();
  }

  function updateCoolUI() {
    coolPauseBtn.textContent = state.coolPaused ? 'Resume' : 'Pause';
    coolPauseBtn.disabled = !state.coolRunning;
    coolStartBtn.disabled = state.coolRunning;
  }

  // ---- Cool target time controls (in waiting state) ----
  function setCoolTarget(seconds) {
    seconds = Math.max(1, Math.min(999, seconds));
    state.coolCountdownSeconds = seconds;
    coolTargetInput.value = seconds;
  }

  coolTargetInput.addEventListener('change', () => {
    let val = parseInt(coolTargetInput.value);
    if (isNaN(val) || val < 1) val = 1;
    setCoolTarget(val);
  });

  coolTargetInput.addEventListener('input', () => {
    let val = parseInt(coolTargetInput.value);
    if (!isNaN(val) && val >= 1) setCoolTarget(val);
  });

  $('cool-target-up-5').addEventListener('click', () => setCoolTarget(state.coolCountdownSeconds + 5));
  $('cool-target-down-5').addEventListener('click', () => setCoolTarget(state.coolCountdownSeconds - 5));

  // ---- Cool mode toggle (in waiting state) ----
  document.querySelectorAll('#cool-mode-countdown, #cool-mode-manual').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#cool-mode-countdown, #cool-mode-manual').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.coolMode = btn.dataset.mode;
      coolTitle.textContent = state.coolMode === 'countdown' ? 'Cool Down' : 'Wait for Ready';
      if (state.heatTargetReached && !state.coolRunning) {
        resetCoolPhase();
        activateCoolPhase();
      }
    });
  });

  // ---- Session logging ----
  function logSession() {
    const totalMs = state.heatElapsed + state.coolElapsed;
    state.log.unshift({
      time: new Date().toLocaleTimeString(),
      heatTime: fmtMs(state.heatElapsed),
      coolTime: state.coolMode === 'countdown' ? fmtMs(state.coolElapsed) : 'manual',
      totalTime: fmtMs(totalMs),
      timestamp: now()
    });
    renderLog();
  }

  function renderLog() {
    const list = $('log-list');
    if (state.log.length === 0) {
      list.innerHTML = '<div class="empty-log">No sessions yet. Start heating to begin.</div>';
      return;
    }
    list.innerHTML = state.log.map(e => `
      <div class="log-entry">
        <div class="log-time">${e.time}</div>
        <div class="log-detail">
          <span class="log-tag">heat ${e.heatTime}</span>
          <span class="log-tag">cool ${e.coolTime}</span>
          <span class="log-tag">total ${e.totalTime}</span>
        </div>
      </div>
    `).join('');
  }

  function resetAll() {
    resetCoolPhase();
    resetHeat();
  }

  // ---- Event bindings ----
  $('heat-start').addEventListener('click', startHeat);
  $('heat-pause').addEventListener('click', pauseHeat);
  $('heat-reset').addEventListener('click', resetHeat);

  $('cool-start').addEventListener('click', startCool);
  $('cool-pause').addEventListener('click', pauseCool);
  $('cool-reset').addEventListener('click', resetCoolPhase);

  $('log-clear').addEventListener('click', () => {
    state.log = [];
    renderLog();
  });

  // ---- Keyboard shortcuts ----
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
      case ' ':
        if (state.heatRunning && !state.coolRunning) pauseHeat();
        else if (state.coolRunning) pauseCool();
        break;
      case 'r': case 'R': resetAll(); break;
      case 's': case 'S': if (!state.heatRunning && !state.heatTargetReached) startHeat(); break;
      case 'c': case 'C':
        if (state.heatTargetReached && !state.coolRunning) startCool();
        break;
    }
  });

  // ---- Init ----
  updateHeatUI();
  setCoolTarget(60);
</script>
</body>
</html>
