<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dab Timer</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #161618;
    --border: #2a2a30;
    --text: #e4e4e7;
    --muted: #6b6b76;
    --accent: #a78bfa;
    --heat: #f97316;
    --ready: #4ade80;
    --warn: #facc15;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1.5rem;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 480px;
  }

  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .timer-display {
    font-size: 3rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 1rem 0;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  .timer-display.ready {
    color: var(--ready);
  }

  .timer-display.heating {
    color: var(--heat);
  }

  .controls {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    margin-top: 1rem;
  }

  button {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  button:hover { background: #3a3a42; }
  button:active { transform: scale(0.97); }

  button.primary {
    background: var(--accent);
    color: #0d0d0f;
    font-weight: 600;
  }

  button.primary:hover { background: #c4b5fd; }

  button.danger {
    background: #dc2626;
    color: #fff;
  }

  button.danger:hover { background: #ef4444; }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .temp-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin: 1rem 0;
  }

  .temp-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.5rem;
    font-family: 'SF Mono', 'Consolas', monospace;
    width: 100px;
    text-align: center;
    padding: 0.5rem;
    border-radius: 6px;
  }

  .temp-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .step-btn {
    width: 48px;
    height: 48px;
    font-size: 1.5rem;
    background: var(--border);
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .step-btn:hover { background: #3a3a42; }

  .alert-bar {
    text-align: center;
    padding: 0.75rem;
    border-radius: 8px;
    margin-top: 1rem;
    font-weight: 600;
    display: none;
  }

  .alert-bar.show { display: block; }

  .alert-bar.heat-reached {
    background: rgba(249, 115, 22, 0.15);
    color: var(--heat);
    border: 1px solid var(--heat);
  }

  .alert-bar.ready {
    background: rgba(74, 222, 128, 0.15);
    color: var(--ready);
    border: 1px solid var(--ready);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .session-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-top: 1rem;
    text-align: center;
  }

  .session-stat {
    background: var(--bg);
    padding: 0.75rem;
    border-radius: 6px;
  }

  .session-stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .session-stat-value {
    font-size: 1.1rem;
    font-family: 'SF Mono', 'Consolas', monospace;
    margin-top: 0.25rem;
  }

  .log-section {
    max-width: 480px;
    width: 100%;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .log-clear {
    font-size: 0.75rem;
    color: var(--muted);
    background: none;
    padding: 0.25rem 0.5rem;
  }

  .log-clear:hover { color: var(--text); }

  .log-list {
    max-height: 200px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .log-entry {
    background: var(--bg);
    padding: 0.75rem 1rem;
    border-radius: 6px;
    font-size: 0.8rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.5rem 1rem;
  }

  .log-time {
    color: var(--muted);
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 0.75rem;
  }

  .log-detail {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .log-tag {
    color: var(--muted);
  }

  .empty-log {
    color: var(--muted);
    text-align: center;
    padding: 2rem;
    font-size: 0.85rem;
  }

  .countdown-mode {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin: 0.75rem 0;
  }

  .countdown-mode label {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .mode-btn {
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .mode-btn.active {
    background: var(--accent);
    color: #0d0d0f;
    border-color: var(--accent);
  }

  .divider {
    height: 1px;
    background: var(--border);
    width: 100%;
    max-width: 480px;
    margin: 0.5rem 0;
  }
</style>
</head>
<body>

<h1>Dab Timer</h1>

<!-- HEAT TIMER CARD -->
<div class="card">
  <div class="card-title">Heat Timer</div>
  <div class="timer-display" id="heat-timer">00:00</div>

  <div class="temp-controls">
    <button class="step-btn" id="temp-down-10">−10°</button>
    <button class="step-btn" id="temp-down-1">−1°</button>
    <input type="number" class="temp-input" id="temp-input" value="315" min="0" max="500">
    <button class="step-btn" id="temp-up-1">+1°</button>
    <button class="step-btn" id="temp-up-10">+10°</button>
  </div>

  <div class="countdown-mode">
    <label>Cool-down:</label>
    <button class="mode-btn active" data-mode="countdown" id="mode-countdown">Timer</button>
    <button class="mode-btn" data-mode="manual" id="mode-manual">Manual</button>
  </div>

  <div class="controls">
    <button class="primary" id="heat-start">Start Heating</button>
    <button id="heat-pause" disabled>Pause</button>
    <button class="danger" id="heat-reset">Reset</button>
  </div>

  <div class="alert-bar heat-reached" id="heat-alert">
    🔥 Target temp reached! Start cooling now.
  </div>

  <div class="session-info">
    <div class="session-stat">
      <div class="session-stat-label">Temp</div>
      <div class="session-stat-value" id="current-temp">— °F</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Heat Time</div>
      <div class="session-stat-value" id="heat-duration-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Target</div>
      <div class="session-stat-value" id="target-temp-display">315°F</div>
    </div>
  </div>
</div>

<!-- COOL/WAIT TIMER CARD -->
<div class="card" id="cool-card" style="display:none;">
  <div class="card-title" id="cool-title">Cool Down</div>
  <div class="timer-display ready" id="cool-timer">00:00</div>

  <div class="controls">
    <button class="primary" id="cool-start" style="display:none;">Ready to Hit</button>
    <button id="cool-pause" disabled>Pause</button>
    <button class="danger" id="cool-reset">Reset</button>
  </div>

  <div class="alert-bar ready" id="cool-alert">
    ✅ Ready to hit!
  </div>

  <div class="session-info">
    <div class="session-stat">
      <div class="session-stat-label">Cool Time</div>
      <div class="session-stat-value" id="cool-duration-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Total Session</div>
      <div class="session-stat-value" id="total-duration-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Temp When Ready</div>
      <div class="session-stat-value" id="ready-temp-display">— °F</div>
    </div>
  </div>
</div>

<div class="divider"></div>

<!-- SESSION LOG -->
<div class="card log-section">
  <div class="log-header">
    <div class="card-title" style="margin-bottom:0;">Session Log</div>
    <button class="log-clear" id="log-clear">Clear</button>
  </div>
  <div class="log-list" id="log-list">
    <div class="empty-log">No sessions yet. Start heating to begin.</div>
  </div>
</div>

<script>
  // State
  const state = {
    heatRunning: false,
    heatPaused: false,
    heatElapsed: 0,       // ms
    heatStartTimestamp: 0,

    coolRunning: false,
    coolPaused: false,
    coolElapsed: 0,
    coolStartTimestamp: 0,
    coolMode: 'countdown', // or 'manual'
    coolCountdownSeconds: 60,

    temp: 315,
    targetTemp: 315,
    tempReached: false,
    readyTemp: null,

    log: []
  };

  // DOM refs
  const $ = id => document.getElementById(id);
  const heatTimerEl = $('heat-timer');
  const coolTimerEl = $('cool-timer');
  const tempInput = $('temp-input');
  const currentTempEl = $('current-temp');
  const heatDurationDisplay = $('heat-duration-display');
  const coolDurationDisplay = $('cool-duration-display');
  const totalDurationDisplay = $('total-duration-display');
  const targetTempDisplay = $('target-temp-display');
  const readyTempDisplay = $('ready-temp-display');
  const heatAlert = $('heat-alert');
  const coolAlert = $('cool-alert');
  const coolCard = $('cool-card');
  const coolTitle = $('cool-title');

  let heatTimerInterval = null;
  let coolTimerInterval = null;

  // Format time
  function fmt(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function fmtFull(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function now() { return Date.now(); }

  // Heat timer logic
  function startHeat() {
    state.heatRunning = true;
    state.heatPaused = false;
    state.heatStartTimestamp = now() - state.heatElapsed;
    heatTimerInterval = setInterval(tickHeat, 100);
    updateHeatUI();
  }

  function tickHeat() {
    if (!state.heatPaused) {
      state.heatElapsed = now() - state.heatStartTimestamp;
      heatTimerEl.textContent = fmtFull(state.heatElapsed);
      heatDurationDisplay.textContent = fmtFull(state.heatElapsed);

      // Check if temp reached (user must set temp manually to match their rig)
      if (state.temp >= state.targetTemp && !state.tempReached) {
        state.tempReached = true;
        heatAlert.classList.add('show');
        // Auto-show cool card
        coolCard.style.display = 'block';
        coolTitle.textContent = 'Cool Down';
        if (state.coolMode === 'countdown') {
          coolTimerEl.textContent = fmt(state.coolCountdownSeconds);
        }
      }
    }
  }

  function pauseHeat() {
    state.heatPaused = !state.heatPaused;
    updateHeatUI();
  }

  function resetHeat() {
    state.heatRunning = false;
    state.heatPaused = false;
    state.heatElapsed = 0;
    state.tempReached = false;
    if (heatTimerInterval) clearInterval(heatTimerInterval);
    heatTimerInterval = null;
    heatTimerEl.textContent = '00:00';
    heatDurationDisplay.textContent = '00:00';
    heatAlert.classList.remove('show');
    coolCard.style.display = 'none';
    updateHeatUI();
  }

  function updateHeatUI() {
    $('heat-start').disabled = state.heatRunning && !state.heatPaused;
    $('heat-pause').disabled = !state.heatRunning;
    $('heat-pause').textContent = state.heatPaused ? 'Resume' : 'Pause';
  }

  // Cool timer logic
  function startCool() {
    if (state.coolMode === 'countdown') {
      state.coolElapsed = 0;
      state.coolRunning = true;
      state.coolPaused = false;
      state.coolStartTimestamp = now();
      coolTimerInterval = setInterval(tickCool, 100);
      updateCoolUI();
    } else {
      // Manual mode: button becomes "I'm ready" — log the session
      logSession();
      resetAll();
    }
  }

  function tickCool() {
    if (!state.coolPaused) {
      state.coolElapsed = now() - state.coolStartTimestamp;
      const remaining = Math.max(0, state.coolCountdownSeconds * 1000 - state.coolElapsed);
      coolTimerEl.textContent = fmtFull(remaining);

      coolDurationDisplay.textContent = fmtFull(state.coolElapsed);

      if (remaining <= 0) {
        // Ready!
        coolAlert.classList.add('show');
        state.coolRunning = false;
        clearInterval(coolTimerInterval);
        coolTimerInterval = null;
        // Log the session
        logSession();
        resetAll();
      }
    }
  }

  function pauseCool() {
    state.coolPaused = !state.coolPaused;
    updateCoolUI();
  }

  function resetCool() {
    state.coolRunning = false;
    state.coolPaused = false;
    state.coolElapsed = 0;
    if (coolTimerInterval) clearInterval(coolTimerInterval);
    coolTimerInterval = null;
    const remaining = state.coolMode === 'countdown' ? state.coolCountdownSeconds : 0;
    coolTimerEl.textContent = state.coolMode === 'countdown' ? fmt(remaining) : '00:00';
    coolDurationDisplay.textContent = '00:00';
    coolAlert.classList.remove('show');
    updateCoolUI();
  }

  function updateCoolUI() {
    $('cool-start').style.display = state.coolMode === 'countdown' ? 'none' : 'inline-block';
    $('cool-start').textContent = '✅ Mark Ready';
    $('cool-pause').disabled = !state.coolRunning;
    $('cool-pause').textContent = state.coolPaused ? 'Resume' : 'Pause';
  }

  // Session logging
  function logSession() {
    const totalMs = state.heatElapsed + state.coolElapsed;
    const entry = {
      time: new Date().toLocaleTimeString(),
      temp: state.temp,
      heatTime: fmtFull(state.heatElapsed),
      coolTime: state.coolMode === 'countdown' ? fmtFull(state.coolElapsed) : 'manual',
      totalTime: fmtFull(totalMs),
      timestamp: now()
    };
    state.log.unshift(entry);
    renderLog();
  }

  function renderLog() {
    const list = $('log-list');
    if (state.log.length === 0) {
      list.innerHTML = '<div class="empty-log">No sessions yet. Start heating to begin.</div>';
      return;
    }
    list.innerHTML = state.log.map(e => `
      <div class="log-entry">
        <div class="log-time">${e.time}</div>
        <div class="log-detail">
          <span class="log-tag">🔥 ${e.temp}°F</span>
          <span class="log-tag">heat ${e.heatTime}</span>
          <span class="log-tag">cool ${e.coolTime}</span>
          <span class="log-tag">total ${e.totalTime}</span>
        </div>
      </div>
    `).join('');
  }

  function resetAll() {
    resetHeat();
    resetCool();
    // Check if we should re-show heat alert cleared
    state.tempReached = false;
    heatAlert.classList.remove('show');
  }

  // Temperature controls
  tempInput.addEventListener('change', () => {
    let val = parseInt(tempInput.value) || 315;
    val = Math.max(0, Math.min(500, val));
    state.temp = val;
    tempInput.value = val;
    currentTempEl.textContent = `${val}°F`;
    checkTempAlert();
  });

  tempInput.addEventListener('input', () => {
    let val = parseInt(tempInput.value);
    if (!isNaN(val)) {
      val = Math.max(0, Math.min(500, val));
      state.temp = val;
      currentTempEl.textContent = `${val}°F`;
      checkTempAlert();
    }
  });

  function checkTempAlert() {
    if (state.temp >= state.targetTemp && !state.tempReached && state.heatRunning && !state.heatPaused) {
      state.tempReached = true;
      heatAlert.classList.add('show');
      coolCard.style.display = 'block';
      coolTitle.textContent = 'Cool Down';
      if (state.coolMode === 'countdown') {
        coolTimerEl.textContent = fmt(state.coolCountdownSeconds);
      }
    }
  }

  function setTemp(delta) {
    let val = state.temp + delta;
    val = Math.max(0, Math.min(500, val));
    state.temp = val;
    tempInput.value = val;
    currentTempEl.textContent = `${val}°F`;
    checkTempAlert();
  }

  $('temp-up-1').addEventListener('click', () => setTemp(1));
  $('temp-down-1').addEventListener('click', () => setTemp(-1));
  $('temp-up-10').addEventListener('click', () => setTemp(10));
  $('temp-down-10').addEventListener('click', () => setTemp(-10));

  // Button handlers
  $('heat-start').addEventListener('click', startHeat);
  $('heat-pause').addEventListener('click', pauseHeat);
  $('heat-reset').addEventListener('click', resetHeat);

  $('cool-start').addEventListener('click', startCool);
  $('cool-pause').addEventListener('click', pauseCool);
  $('cool-reset').addEventListener('click', resetCool);

  // Countdown mode toggle
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.coolMode = btn.dataset.mode;
      resetCool();
      if (state.coolMode === 'countdown') {
        coolTimerEl.textContent = fmt(state.coolCountdownSeconds);
        coolTitle.textContent = 'Cool Down';
      } else {
        coolTimerEl.textContent = '00:00';
        coolTitle.textContent = 'Wait for Ready';
      }
      updateCoolUI();
    });
  });

  // Clear log
  $('log-clear').addEventListener('click', () => {
    state.log = [];
    renderLog();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
      case ' ': // Space — toggle heat pause or cool pause
        if (state.heatRunning && !state.coolRunning) {
          pauseHeat();
        } else if (state.coolRunning) {
          pauseCool();
        }
        break;
      case 'r': case 'R':
        resetHeat();
        break;
      case 's': case 'S': // Start/stop heat
        if (!state.heatRunning) startHeat();
        break;
      case 'c': case 'C': // Start cool
        if (state.tempReached && !state.coolRunning) {
          startCool();
        }
        break;
    }
  });

  // Init
  targetTempDisplay.textContent = `${state.targetTemp}°F`;
  currentTempEl.textContent = `${state.temp}°F`;
  updateHeatUI();
  updateCoolUI();

  // Allow changing target temp — double-click the target display
  targetTempDisplay.style.cursor = 'pointer';
  targetTempDisplay.title = 'Click to change target temp';
  targetTempDisplay.addEventListener('click', () => {
    const newTarget = prompt('Target temperature (°F):', state.targetTemp);
    if (newTarget) {
      const val = parseInt(newTarget);
      if (!isNaN(val) && val > 0 && val <= 500) {
        state.targetTemp = val;
        targetTempDisplay.textContent = `${val}°F`;
      }
    }
  });

  // Cool countdown duration — click to edit
  readyTempDisplay.style.cursor = 'pointer';
  readyTempDisplay.title = 'Enter temp when ready (optional)';
  readyTempDisplay.addEventListener('click', () => {
    const val = prompt('Temp when ready (°F, optional):', state.readyTemp || '');
    if (val !== null) {
      state.readyTemp = val ? parseInt(val) : null;
      readyTempDisplay.textContent = state.readyTemp ? `${state.readyTemp}°F` : '—';
    }
  });
</script>
</body>
</html>
