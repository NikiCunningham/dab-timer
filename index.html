<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dab Timer</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #161618;
    --border: #2a2a30;
    --text: #e4e4e7;
    --muted: #6b6b76;
    --accent: #a78bfa;
    --heat: #f97316;
    --ready: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1.5rem;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 480px;
  }

  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .timer-display {
    font-size: 3rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 1rem 0;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  .timer-display.ready { color: var(--ready); }
  .timer-display.heating { color: var(--heat); }

  .controls {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    margin-top: 1rem;
  }

  button {
    background: var(--border);
    border: none;
    color: var(--text);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  button:hover { background: #3a3a42; }
  button:active { transform: scale(0.97); }

  button.primary {
    background: var(--accent);
    color: #0d0d0f;
    font-weight: 600;
  }

  button.primary:hover { background: #c4b5fd; }

  button.danger {
    background: #dc2626;
    color: #fff;
  }

  button.danger:hover { background: #ef4444; }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .time-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin: 1rem 0;
    flex-wrap: wrap;
  }

  .input-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg);
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .input-group label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .time-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.5rem;
    font-family: 'SF Mono', 'Consolas', monospace;
    width: 72px;
    text-align: center;
    padding: 0.25rem;
    border-radius: 4px;
  }

  .time-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .step-btn {
    width: 40px;
    height: 40px;
    font-size: 1.25rem;
    background: var(--border);
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .step-btn:hover { background: #3a3a42; }

  .target-display {
    text-align: center;
    margin: 0.5rem 0 1rem;
    padding: 0.75rem;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .target-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .target-value {
    font-size: 1.5rem;
    font-family: 'SF Mono', 'Consolas', monospace;
    color: var(--heat);
    margin-top: 0.25rem;
    cursor: pointer;
  }

  .target-value:hover { text-decoration: underline; }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 1rem 0;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--heat), var(--ready));
    border-radius: 2px;
    transition: width 0.1s linear;
    width: 0%;
  }

  .alert-bar {
    text-align: center;
    padding: 0.75rem;
    border-radius: 8px;
    margin-top: 1rem;
    font-weight: 600;
    display: none;
  }

  .alert-bar.show { display: block; }

  .alert-bar.heat-reached {
    background: rgba(249, 115, 22, 0.15);
    color: var(--heat);
    border: 1px solid var(--heat);
  }

  .alert-bar.ready {
    background: rgba(74, 222, 128, 0.15);
    color: var(--ready);
    border: 1px solid var(--ready);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .session-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-top: 1rem;
    text-align: center;
  }

  .session-stat {
    background: var(--bg);
    padding: 0.75rem;
    border-radius: 6px;
  }

  .session-stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .session-stat-value {
    font-size: 1.1rem;
    font-family: 'SF Mono', 'Consolas', monospace;
    margin-top: 0.25rem;
  }

  .log-section {
    max-width: 480px;
    width: 100%;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .log-clear {
    font-size: 0.75rem;
    color: var(--muted);
    background: none;
    padding: 0.25rem 0.5rem;
  }

  .log-clear:hover { color: var(--text); }

  .log-list {
    max-height: 200px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .log-entry {
    background: var(--bg);
    padding: 0.75rem 1rem;
    border-radius: 6px;
    font-size: 0.8rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.5rem 1rem;
  }

  .log-time {
    color: var(--muted);
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 0.75rem;
  }

  .log-detail {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .log-tag { color: var(--muted); }

  .empty-log {
    color: var(--muted);
    text-align: center;
    padding: 2rem;
    font-size: 0.85rem;
  }

  .countdown-mode {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin: 0.75rem 0;
  }

  .countdown-mode label {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .mode-btn {
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .mode-btn.active {
    background: var(--accent);
    color: #0d0d0f;
    border-color: var(--accent);
  }

  .divider {
    height: 1px;
    background: var(--border);
    width: 100%;
    max-width: 480px;
    margin: 0.5rem 0;
  }
</style>
</head>
<body>

<h1>Dab Timer</h1>

<!-- HEAT TIMER CARD -->
<div class="card">
  <div class="card-title">Heat Timer</div>
  <div class="timer-display heating" id="heat-timer">00:00</div>

  <div class="target-display">
    <div class="target-label">Target Heat Time</div>
    <div class="target-value" id="target-value">45s</div>
  </div>

  <div class="time-controls">
    <div class="input-group">
      <label>Heat for</label>
      <button class="step-btn" id="target-down-5" title="−5s">−5</button>
      <input type="number" class="time-input" id="target-input" value="45" min="1" max="999">
      <button class="step-btn" id="target-up-5" title="+5s">+5</button>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="controls">
    <button class="primary" id="heat-start">Start Heating</button>
    <button id="heat-pause" disabled>Pause</button>
    <button class="danger" id="heat-reset">Reset</button>
  </div>

  <div class="alert-bar heat-reached" id="heat-alert">
    ⏱ Target time reached! Start cooling now.
  </div>

  <div class="session-info">
    <div class="session-stat">
      <div class="session-stat-label">Elapsed</div>
      <div class="session-stat-value" id="heat-duration-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Target</div>
      <div class="session-stat-value" id="target-display-stat">45s</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Progress</div>
      <div class="session-stat-value" id="progress-pct">0%</div>
    </div>
  </div>
</div>

<!-- COOL/WAIT TIMER CARD -->
<div class="card" id="cool-card" style="display:none;">
  <div class="card-title" id="cool-title">Cool Down</div>
  <div class="timer-display ready" id="cool-timer">00:00</div>

  <div class="countdown-mode">
    <label>Cool-down:</label>
    <button class="mode-btn active" data-mode="countdown" id="mode-countdown">Timer</button>
    <button class="mode-btn" data-mode="manual" id="mode-manual">Manual</button>
  </div>

  <div class="controls">
    <button class="primary" id="cool-start" style="display:none;">Ready to Hit</button>
    <button id="cool-pause" disabled>Pause</button>
    <button class="danger" id="cool-reset">Reset</button>
  </div>

  <div class="alert-bar ready" id="cool-alert">
    ✅ Ready to hit!
  </div>

  <div class="session-info">
    <div class="session-stat">
      <div class="session-stat-label">Cool Time</div>
      <div class="session-stat-value" id="cool-duration-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Total Session</div>
      <div class="session-stat-value" id="total-duration-display">00:00</div>
    </div>
    <div class="session-stat">
      <div class="session-stat-label">Heat Time</div>
      <div class="session-stat-value" id="final-heat-display">00:00</div>
    </div>
  </div>
</div>

<div class="divider"></div>

<!-- SESSION LOG -->
<div class="card log-section">
  <div class="log-header">
    <div class="card-title" style="margin-bottom:0;">Session Log</div>
    <button class="log-clear" id="log-clear">Clear</button>
  </div>
  <div class="log-list" id="log-list">
    <div class="empty-log">No sessions yet. Start heating to begin.</div>
  </div>
</div>

<script>
  const state = {
    heatRunning: false,
    heatPaused: false,
    heatElapsed: 0,
    heatStartTimestamp: 0,

    coolRunning: false,
    coolPaused: false,
    coolElapsed: 0,
    coolStartTimestamp: 0,
    coolMode: 'countdown',
    coolCountdownSeconds: 60,

    targetSeconds: 45,
    targetReached: false,

    log: []
  };

  const $ = id => document.getElementById(id);
  const heatTimerEl = $('heat-timer');
  const coolTimerEl = $('cool-timer');
  const targetInput = $('target-input');
  const targetValueEl = $('target-value');
  const targetDisplayStat = $('target-display-stat');
  const heatDurationDisplay = $('heat-duration-display');
  const coolDurationDisplay = $('cool-duration-display');
  const totalDurationDisplay = $('total-duration-display');
  const finalHeatDisplay = $('final-heat-display');
  const progressFill = $('progress-fill');
  const progressPct = $('progress-pct');
  const heatAlert = $('heat-alert');
  const coolAlert = $('cool-alert');
  const coolCard = $('cool-card');
  const coolTitle = $('cool-title');

  let heatTimerInterval = null;
  let coolTimerInterval = null;

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function fmtMs(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function now() { return Date.now(); }

  // ---- Heat timer ----
  function startHeat() {
    state.heatRunning = true;
    state.heatPaused = false;
    state.heatStartTimestamp = now() - state.heatElapsed;
    heatTimerInterval = setInterval(tickHeat, 100);
    updateHeatUI();
  }

  function tickHeat() {
    if (!state.heatPaused) {
      state.heatElapsed = now() - state.heatStartTimestamp;
      const elapsedSec = state.heatElapsed / 1000;
      heatTimerEl.textContent = fmt(elapsedSec);
      heatDurationDisplay.textContent = fmt(elapsedSec);

      const pct = Math.min(100, (elapsedSec / state.targetSeconds) * 100);
      progressFill.style.width = `${pct}%`;
      progressPct.textContent = `${Math.floor(pct)}%`;

      if (elapsedSec >= state.targetSeconds && !state.targetReached) {
        state.targetReached = true;
        heatAlert.classList.add('show');
        coolCard.style.display = 'block';
        coolTitle.textContent = 'Cool Down';
        if (state.coolMode === 'countdown') {
          coolTimerEl.textContent = fmt(state.coolCountdownSeconds);
          coolTimerEl.classList.add('ready');
        } else {
          coolTimerEl.textContent = '00:00';
        }
      }
    }
  }

  function pauseHeat() {
    state.heatPaused = !state.heatPaused;
    updateHeatUI();
  }

  function resetHeat() {
    state.heatRunning = false;
    state.heatPaused = false;
    state.heatElapsed = 0;
    state.targetReached = false;
    if (heatTimerInterval) clearInterval(heatTimerInterval);
    heatTimerInterval = null;
    heatTimerEl.textContent = '00:00';
    heatDurationDisplay.textContent = '00:00';
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    heatAlert.classList.remove('show');
    coolCard.style.display = 'none';
    updateHeatUI();
  }

  function updateHeatUI() {
    $('heat-start').disabled = state.heatRunning && !state.heatPaused;
    $('heat-pause').disabled = !state.heatRunning;
    $('heat-pause').textContent = state.heatPaused ? 'Resume' : 'Pause';
  }

  // ---- Target time controls ----
  function setTarget(seconds) {
    seconds = Math.max(1, Math.min(999, seconds));
    state.targetSeconds = seconds;
    targetInput.value = seconds;
    targetValueEl.textContent = `${seconds}s`;
    targetDisplayStat.textContent = `${seconds}s`;
  }

  targetInput.addEventListener('change', () => {
    let val = parseInt(targetInput.value);
    if (isNaN(val) || val < 1) val = 1;
    setTarget(val);
  });

  targetInput.addEventListener('input', () => {
    let val = parseInt(targetInput.value);
    if (!isNaN(val) && val >= 1) setTarget(val);
  });

  $('target-up-5').addEventListener('click', () => setTarget(state.targetSeconds + 5));
  $('target-down-5').addEventListener('click', () => setTarget(state.targetSeconds - 5));

  targetValueEl.addEventListener('click', () => {
    const val = prompt('Target heat time (seconds):', state.targetSeconds);
    if (val !== null) {
      const parsed = parseInt(val);
      if (!isNaN(parsed) && parsed >= 1) setTarget(parsed);
    }
  });

  // ---- Cool timer ----
  function startCool() {
    if (state.coolMode === 'countdown') {
      state.coolElapsed = 0;
      state.coolRunning = true;
      state.coolPaused = false;
      state.coolStartTimestamp = now();
      coolTimerInterval = setInterval(tickCool, 100);
      updateCoolUI();
    } else {
      logSession();
      resetAll();
    }
  }

  function tickCool() {
    if (!state.coolPaused) {
      state.coolElapsed = now() - state.coolStartTimestamp;
      const remaining = Math.max(0, state.coolCountdownSeconds - state.coolElapsed / 1000);
      coolTimerEl.textContent = fmt(remaining);
      coolDurationDisplay.textContent = fmt(state.coolElapsed / 1000);

      if (remaining <= 0) {
        coolAlert.classList.add('show');
        state.coolRunning = false;
        clearInterval(coolTimerInterval);
        coolTimerInterval = null;
        logSession();
        resetAll();
      }
    }
  }

  function pauseCool() {
    state.coolPaused = !state.coolPaused;
    updateCoolUI();
  }

  function resetCool() {
    state.coolRunning = false;
    state.coolPaused = false;
    state.coolElapsed = 0;
    if (coolTimerInterval) clearInterval(coolTimerInterval);
    coolTimerInterval = null;
    const remaining = state.coolMode === 'countdown' ? state.coolCountdownSeconds : 0;
    coolTimerEl.textContent = state.coolMode === 'countdown' ? fmt(remaining) : '00:00';
    coolDurationDisplay.textContent = '00:00';
    coolAlert.classList.remove('show');
    updateCoolUI();
  }

  function updateCoolUI() {
    $('cool-start').style.display = state.coolMode === 'countdown' ? 'none' : 'inline-block';
    $('cool-start').textContent = '✅ Mark Ready';
    $('cool-pause').disabled = !state.coolRunning;
    $('cool-pause').textContent = state.coolPaused ? 'Resume' : 'Pause';
  }

  // ---- Logging ----
  function logSession() {
    const totalMs = state.heatElapsed + state.coolElapsed;
    state.log.unshift({
      time: new Date().toLocaleTimeString(),
      heatTime: fmtMs(state.heatElapsed),
      coolTime: state.coolMode === 'countdown' ? fmtMs(state.coolElapsed) : 'manual',
      totalTime: fmtMs(totalMs),
      timestamp: now()
    });
    renderLog();
  }

  function renderLog() {
    const list = $('log-list');
    if (state.log.length === 0) {
      list.innerHTML = '<div class="empty-log">No sessions yet. Start heating to begin.</div>';
      return;
    }
    list.innerHTML = state.log.map(e => `
      <div class="log-entry">
        <div class="log-time">${e.time}</div>
        <div class="log-detail">
          <span class="log-tag">heat ${e.heatTime}</span>
          <span class="log-tag">cool ${e.coolTime}</span>
          <span class="log-tag">total ${e.totalTime}</span>
        </div>
      </div>
    `).join('');
  }

  function resetAll() {
    resetHeat();
    resetCool();
  }

  // ---- Event bindings ----
  $('heat-start').addEventListener('click', startHeat);
  $('heat-pause').addEventListener('click', pauseHeat);
  $('heat-reset').addEventListener('click', resetHeat);

  $('cool-start').addEventListener('click', startCool);
  $('cool-pause').addEventListener('click', pauseCool);
  $('cool-reset').addEventListener('click', resetCool);

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.coolMode = btn.dataset.mode;
      resetCool();
      if (state.coolMode === 'countdown') {
        coolTimerEl.textContent = fmt(state.coolCountdownSeconds);
        coolTitle.textContent = 'Cool Down';
      } else {
        coolTimerEl.textContent = '00:00';
        coolTitle.textContent = 'Wait for Ready';
      }
      updateCoolUI();
    });
  });

  $('log-clear').addEventListener('click', () => {
    state.log = [];
    renderLog();
  });

  // ---- Keyboard shortcuts ----
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
      case ' ':
        if (state.heatRunning && !state.coolRunning) pauseHeat();
        else if (state.coolRunning) pauseCool();
        break;
      case 'r': case 'R': resetHeat(); break;
      case 's': case 'S': if (!state.heatRunning) startHeat(); break;
      case 'c': case 'C':
        if (state.targetReached && !state.coolRunning) startCool();
        break;
    }
  });

  // ---- Init ----
  updateHeatUI();
  updateCoolUI();
  setTarget(45);
</script>
</body>
</html>
